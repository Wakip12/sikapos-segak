<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIKAPOS SEGAK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f4;
      color: #26332b;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    .login-box h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #16784b;
    }

    .login-box p {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #16784b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0f603b;
    }

    .error {
      color: #c62828;
      margin-top: 15px;
      text-align: center;
    }

    .dashboard {
      display: none;
      min-height: 100vh;
    }

    header {
      background: #16784b;
      color: white;
      padding: 25px;
      text-align: center;
    }

    .content {
      max-width: 900px;
      margin: auto;
      padding: 25px;
    }

    .info {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .logout {
      background: #c62828;
      max-width: 200px;
      display: block;
      margin: 25px auto;
    }
  </style>
</head>

<body>

  <!-- HALAMAN LOGIN -->
  <div class="login-page" id="loginPage">
    <div class="login-box">
      <h1>SIKAPOS SEGAK</h1>
      <p>Sistem Informasi Kader Posyandu<br>Desa Sungai Segak</p>

      <form id="loginForm">

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Masukkan email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Masukkan password"
          required
        >

        <button type="submit">MASUK</button>

        <div class="error" id="errorMessage"></div>
      </form>
    </div>
  </div>


  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboardPage">

    <header>
      <h1>SIKAPOS SEGAK</h1>
      <p>Desa Sungai Segak</p>
    </header>

    <div class="content">

      <div class="info">
        <h2>Selamat Datang</h2>
        <p id="userEmail"></p>
        <p><strong>Posyandu:</strong> <span id="posyandu"></span></p>
      </div>

      <div class="cards">

        <div class="card">
          <h2>👶</h2>
          <h3>Balita</h3>
          <p>Data balita</p>
        </div>

        <div class="card">
          <h2>🤰</h2>
          <h3>Ibu Hamil & Nifas</h3>
          <p>Data ibu hamil dan nifas</p>
        </div>

        <div class="card">
          <h2>👧</h2>
          <h3>Rematri</h3>
          <p>Data remaja putri</p>
        </div>

        <div class="card">
          <h2>👵</h2>
          <h3>Lansia</h3>
          <p>Data lansia</p>
        </div>

      </div>

      <button class="logout" id="logoutButton">
        Keluar
      </button>

    </div>
  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://jeyqufctvgkgrkbmhmkv.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_CnnNfFXKq-7KehidQzhF4w_ux7oMBcZ";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    const loginForm = document.getElementById("loginForm");
    const loginPage = document.getElementById("loginPage");
    const dashboardPage = document.getElementById("dashboardPage");
    const errorMessage = document.getElementById("errorMessage");


    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      errorMessage.textContent = "Sedang masuk...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {
        errorMessage.textContent =
          "Login gagal: " + error.message;
        return;
      }


      // Cari data kader berdasarkan user_id
      const { data: kader, error: kaderError } =
        await supabaseClient
          .from("kader")
          .select("nama, posyandu_kode, aktif")
          .eq("user_id", data.user.id)
          .single();

      if (kaderError) {
        errorMessage.textContent =
          "Error kader: " + kaderError.message;
        return;
      }

      if (!kader.aktif) {
        await supabaseClient.auth.signOut();

        errorMessage.textContent =
          "Akun kader tidak aktif.";
        return;
      }


      // Tampilkan dashboard
      loginPage.style.display = "none";
      dashboardPage.style.display = "block";

      document.getElementById("userEmail").textContent =
        "Kader: " + kader.nama;

      document.getElementById("posyandu").textContent =
        kader.posyandu_kode;

    });


    // Tombol keluar
    document.getElementById("logoutButton")
      .addEventListener("click", async function() {

        await supabaseClient.auth.signOut();

        dashboardPage.style.display = "none";
        loginPage.style.display = "flex";

        document.getElementById("loginForm").reset();
        errorMessage.textContent = "";

      });

  </script>

</body>
</html>
